# Runs gitleaks secret scanning on every push and PR using .gitleaks.toml.
# No secrets are needed: GITHUB_TOKEN is provided automatically.

name: secret-scan

on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
