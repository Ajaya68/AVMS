# AJAYA VENTURE - Nginx reverse proxy + static SPA hosting.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hardened security headers (values below are overridden when stricter).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types application/json text/css application/javascript;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed static assets can be cached aggressively
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to the Jakarta Servlet backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        request_id $request_id;
        proxy_set_header X-Request-Id $request_id;
    }
}