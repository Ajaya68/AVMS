services:
  - type: web
    name: avms-backend
    runtime: docker
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_MINUTES
        value: 30
      - key: JWT_REFRESH_DAYS
        value: 7
      - key: CORS_ORIGINS
        sync: false
