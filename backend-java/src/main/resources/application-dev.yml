spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USER:avms}
    password: ${DB_PASSWORD:avms}
    hikari:
      maximum-pool-size: 10

# Dev-only: API docs UI. Prod default is disabled (see application.yml).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Dev-only: forgot-password returns the reset URL on screen (no SMTP locally).
avms:
  auth:
    expose-reset-link: true
