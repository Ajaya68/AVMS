# AJAYA VENTURE - local development composition.
# Oracle runs independently (this machine: Oracle 21c on :1521) by design;
# application containers connect to it and carry no database secrets baked in.
services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    environment:
      APP_ENV: development
      DB_HOST: host.docker.internal
      DB_PORT: "1521"
      DB_SERVICE: orclpdb
      DB_USERNAME: ${DB_USERNAME:-AV_APP}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped