server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Clickjacking / sniffing / referrer hardening (no CSP here: Vite SPA
  # relies on inline bootstrap scripts that a strict CSP would break).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # React SPA fallback: /login, /dashboard, /sales, ... -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache entry point, cache hashed assets long
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
